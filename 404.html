<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0d">
<title>Page not found | RedPill Audio</title>
<meta name="robots" content="noindex">
<!-- 404 is served by Vercel for any unmatched route, so asset paths here are
     root-relative (leading slash), not relative like the other pages. -->
<link rel="icon" type="image/png" sizes="512x512" href="/assets/img/favicon-512.png">
<link rel="icon" type="image/png" sizes="180x180" href="/assets/img/favicon-180.png">
<link rel="apple-touch-icon" href="/assets/img/favicon-180.png">
<style>
  body{background:#0b0b0d;color:#f2f1ee}
  a{color:inherit;text-decoration:none}
  .notfound{min-height:100svh;display:grid;place-items:center;text-align:center;padding:80px 0}
  .notfound .brand{justify-content:center;margin-bottom:44px}
  .notfound h1{font-size:clamp(40px,7vw,84px);margin:12px 0 18px}
  .notfound .lead{max-width:42ch;margin:0 auto}
  .notfound__cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:34px}
</style>
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

<main class="notfound">
  <div class="wrap">
    <a href="/" class="brand" aria-label="RedPill Audio">
      <img class="brand__wordmark" src="/assets/img/logo-wordmark.png" alt="RedPill Audio">
    </a>
    <span class="eyebrow" style="justify-content:center">Error 404</span>
    <h1>Page not found</h1>
    <p class="lead">This page doesn't exist. The sound does.</p>
    <div class="notfound__cta">
      <a class="btn btn--red" href="/">Home</a>
      <a class="btn" href="/shop.html">Shop</a>
      <a class="btn" href="/index.html#get-in-touch">Contact</a>
    </div>
  </div>
</main>

</body>
</html>
